server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_product
    username: ecommerce
    password: ecommerce
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
