server:
  port: 8091

spring:
  datasource:
    url: jdbc:h2:file:./data/productdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jackson:
    serialization:
      indent-output: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics